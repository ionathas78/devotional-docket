<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Devotional Docket</title>
<link rel="stylesheet" href="css/base.css">
<link id="theme" rel="stylesheet" href="presentation/themes/default/theme.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<header class="site-header"><a href="./">Devotional Docket</a><label>Theme <select id="theme-picker"></select></label></header>
<details id="preferences"><summary>Reading preferences</summary><div id="preference-controls"><label>Text size <input type="range" id="size" min="80" max="180" step="5"><output for="size"></output></label><label>Line spacing <input type="range" id="spacing" min="1.2" max="2.4" step=".1"><output for="spacing"></output></label><label>Reading width <input type="range" id="width" min="28" max="64" step="2"><output for="width"></output></label><div id="decoration-controls"></div><button id="reset" type="button">Reset preferences</button></div></details>
<main id="reader" aria-busy="true"><p id="status" role="status">Loading devotional…</p><article id="devotional" hidden></article></main>
<footer class="site-footer"><button id="share" hidden>Copy link</button><button id="share-custom" hidden>Copy customized link</button><span id="feedback" role="status"></span></footer>
<noscript>JavaScript is required to load devotionals.</noscript>
</body>
</html>
